databases:
  - name: fundmatch-db
    databaseName: fundmatch_ai
    user: fundmatch
    plan: free
    region: oregon

services:
  - type: web
    name: fundmatch-api
    runtime: node
    region: oregon
    branch: main
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/db/migrate.js && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fundmatch-db
          property: connectionString
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FRONTEND_URL
        fromService:
          name: fundmatch-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: fundmatch-web
    runtime: node
    region: oregon
    branch: main
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://fundmatch-api.onrender.com
